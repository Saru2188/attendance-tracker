<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1>85% Attendance Tracker</h1>
      <p class="subtitle">Multi-Course Management</p>
    </header>

    <!-- Add New Course Section -->
    <section class="card">
      <h2>Add New Course</h2>
      <form id="add-course-form">
        <div class="input-group">
          <label for="course-name">Course Name:</label>
          <input type="text" id="course-name" placeholder="e.g. Mathematics, Physics" required>
        </div>
        <div class="input-group flex-row">
          <div>
            <label for="initial-total">Total Held:</label>
            <input type="number" id="initial-total" min="0" placeholder="0" value="0" required>
          </div>
          <div>
            <label for="initial-attended">Attended:</label>
            <input type="number" id="initial-attended" min="0" placeholder="0" value="0" required>
          </div>
        </div>
        <button type="submit" class="btn-primary">Add Course</button>
      </form>
    </section>

    <!-- Course List Section -->
    <section class="card">
      <h2>Your Courses</h2>
      <div id="course-list" class="course-list">
        <!-- Dynamic course cards injected via JS -->
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
